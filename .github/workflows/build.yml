name: build
on:
  push:
    branches: [release-2.0.11]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install ESP32 core
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.11
      - name: Compile
        run: |
          mkdir -p /tmp/OnStep
          cp -r . /tmp/OnStep/
          arduino-cli compile --fqbn esp32:esp32:esp32:FlashMode=dio,FlashFreq=40,PartitionScheme=huge_app --export-binaries /tmp/OnStep
      - name: Collect files
        run: |
          mkdir out
          find /tmp/OnStep/build -name '*.bin' -exec cp {} out/ \;
          cp ~/.arduino15/packages/esp32/hardware/esp32/2.0.11/tools/partitions/boot_app0.bin out/
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: onstep-bins
          path: out
